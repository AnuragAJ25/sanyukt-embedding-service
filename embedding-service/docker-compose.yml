services:
  embedding-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: sanyukt-embedding-service:latest
    container_name: sanyukt-embedding-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - EMBEDDING_API_TOKEN=${EMBEDDING_API_TOKEN}
      - EMBEDDING_MODEL=intfloat/multilingual-e5-small
      - MAX_BATCH_SIZE=64
      - MAX_CONCURRENT_INFERENCE=1
      - PORT=8000
      - HOST=0.0.0.0
      - LOG_LEVEL=INFO
      - DEVICE=cpu
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '1.0'
          memory: 1024M
