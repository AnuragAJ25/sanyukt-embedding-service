services:
  embedding-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: multilingual-e5-api:latest
    container_name: multilingual-e5-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - EMBEDDING_API_TOKEN=${EMBEDDING_API_TOKEN}
      - EMBEDDING_MODEL=intfloat/multilingual-e5-small
      - MAX_BATCH_SIZE=64
      - PORT=8000
      - HOST=0.0.0.0
      - LOG_LEVEL=INFO
      - DEVICE=cpu
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    resources:
      limits:
        memory: 2G
        cpus: '2.0'
